// ひらがな五十音順ソート用（KANA_ROWS の表示順＝せいおん→だくてん→はんだくてん→こもじ、をそのまま並び順にする）
const GOJUON_ORDER = [];
KANA_ROWS.forEach(row => {
  ["kana","dakuten","handakuten","small"].forEach(key => {
    if (row[key]) row[key].forEach(k => GOJUON_ORDER.push(k.char));
  });
});
const KANA_INDEX = Object.fromEntries(GOJUON_ORDER.map((c,i) => [c,i]));

function compareKana(a, b) {
  const len = Math.min(a.length, b.length);
  for (let i=0;i<len;i++) {
    const ia = KANA_INDEX[a[i]] ?? 999;
    const ib = KANA_INDEX[b[i]] ?? 999;
    if (ia !== ib) return ia - ib;
  }
  return a.length - b.length;
}

// 「しゅ」「きゃ」のような拗音は、音質の低いデフォルト音声だと2文字がバラバラに
// 発音されてしまうことがある。Edgeの「Natural/Online」音声やGoogle音声は拗音の
// つながりが自然なので、使える中で一番自然な音声を優先的に選ぶ。
function pickJapaneseVoice(voices) {
  const jp = voices.filter(v => v.lang === "ja-JP" || v.lang === "ja_JP");
  if (!jp.length) return null;
  const rank = (v) => {
    if (/natural|online|neural/i.test(v.name)) return 0;
    if (/google/i.test(v.name)) return 1;
    return 2;
  };
  return [...jp].sort((a, b) => rank(a) - rank(b))[0];
}

function speak(text, rate) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = rate; u.pitch = 1.1; u.volume = 1;
  const v = pickJapaneseVoice(window.speechSynthesis.getVoices());
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

// ================= Googleログイン＋家族きょうゆう（Firebase） =================
// pecs-app・スケジュールアプリと同じ Firebase プロジェクト（pecs-family）を使う。Firestore の形：
//   hatsuonFamilies/{fid}             allowedEmails, ownerUid, favs（お気に入りの配列）
//   hatsuonFamilies/{fid}/pics/{id}   word, data（JPEGのdata URL）… 1MB制限に近づかないよう写真は1枚1ドキュメント
// 並び替えモード（あいうえお順/手動）は端末ごとの設定のまま。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3j4Sf0JVFDnBQDxge3EnA17hARnIUWno",
  authDomain: "pecs-family.firebaseapp.com",

const FAMILY_KEY = "hatsuon-family-id";
// PCのファイルを直接開いたときはGoogleログインが使えないので、今まで通りこの端末だけで動かす
const CLOUD_AVAILABLE = (() => {
  if (typeof firebase === "undefined" || location.protocol === "file:") return false;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.firestore().enablePersistence({ synchronizeTabs:true }).catch(() => {});

  } catch { return false; }
})();
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch {} };
const picDocId = (word) => "w_" + encodeURIComponent(word).replace(/\./g, "%2E");
const MAX_PIC_CHARS = 900000; // Firestore の1ドキュメント1MB制限より小さく

// 写真を小さめのJPEGにする（きょうゆうのため。もとの写真はそのまま残らない）
function compressImage(src, maxDim = 800, quality = 0.8) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}
async function shrinkForCloud(src) {
  let out = src;
  for (const [dim, q] of [[800, 0.8], [600, 0.7], [400, 0.6]]) {
    if (out.length <= MAX_PIC_CHARS) break;
    out = await compressImage(src, dim, q);
  }
  return out;
}

function syncErrorMessage(e) {
  const msg = (e && e.code === "permission-denied") ? "きょうゆうの けんげんが ありません" : "どうきが できませんでした";
  return msg + (e && e.message ? `（${e.message}）` : "");
}

function useCloudSync({ favs, setFavs, pics, setPics, draggingRef, dragId }) {
  const [authKnown, setAuthKnown] = useState(!CLOUD_AVAILABLE);
  const [user, setUser]     = useState(null);
  const [status, setStatus] = useState("off"); // off | connecting | ok | offline | error
  const [error, setError]   = useState("");
  const [emails, setEmails] = useState([]);
  const [ready, setReady]   = useState(false);
  const [picsReady, setPicsReady] = useState(false);
  const latest = useRef({ favs, pics });
  latest.current = { favs, pics };
  const s = useRef({ famRef:null, unsubs:[], lastFavs:null, lastPics:{}, cloudPics:{}, uploading:{} });

  const fail = (e) => { console.error(e); setStatus("error"); setError(syncErrorMessage(e)); };

  const stopSync = () => {
    s.current.unsubs.forEach(u => { try { u(); } catch {} });
    s.current = { famRef:null, unsubs:[], lastFavs:null, lastPics:{}, cloudPics:{}, uploading:{} };
    setReady(false); setPicsReady(false); setEmails([]);
  };

  const applyRemoteFavs = (remote) => {
    const list = Array.isArray(remote) ? remote : [];
    s.current.lastFavs = JSON.stringify(list);
    setFavs(list);
  };

  // はじめてこの端末が、もうデータのある家族に入るとき：両方のお気に入り・写真をのこす
  const mergeCloudIntoLocal = async (ref) => {
    const [doc, picsSnap] = await Promise.all([ref.get(), ref.collection("pics").get()]);
    const remoteFavs = (doc.data() || {}).favs || [];
    const words = new Set(remoteFavs.map(f => f.word));
    const merged = [...remoteFavs, ...latest.current.favs.filter(f => !words.has(f.word))];
    const mergedPics = { ...latest.current.pics };
    picsSnap.forEach(d => { const { word, data } = d.data(); if (word && data) mergedPics[word] = data; });
    latest.current = { favs: merged, pics: mergedPics };
    setFavs(merged); setPics(mergedPics);
  };
  const uploadFavs = (ref, isNew, email, uid) => {
    const body = { favs: latest.current.favs, updatedAt: Date.now() };
    return isNew
      ? ref.set({ ownerUid: uid, allowedEmails: [email], createdAt: Date.now(), ...body })
      : ref.update(body);
  };

  const uploadAllPics = (ref) => Promise.all(Object.entries(latest.current.pics).map(async ([word, data]) => {
    const small = await shrinkForCloud(data);
    await ref.collection("pics").doc(picDocId(word)).set({ word, data: small, updatedAt: Date.now() });
  }));

  const subscribe = (ref) => {
    let gotMain = false, gotPics = false;
    s.current.unsubs.push(ref.onSnapshot({ includeMetadataChanges:true }, (snap) => {
      if (!snap.exists) { lsSet(FAMILY_KEY, null); return; } // 家族からはずされた（消された）：次回さがしなおす
      const data = snap.data();
      setEmails(data.allowedEmails || []);
      // 並び替え中にとどいた変更は、指をはなしたあと自分の並びで上書きする
      if (!snap.metadata.hasPendingWrites && !draggingRef.current) applyRemoteFavs(data.favs);
      if (!gotMain) { gotMain = true; setReady(true); }
      setStatus(snap.metadata.fromCache ? "offline" : "ok"); setError("");
    }, (e) => { if (e && e.code === "permission-denied") lsSet(FAMILY_KEY, null); fail(e); }));
    s.current.unsubs.push(ref.collection("pics").onSnapshot((qs) => {
      if (!gotPics) {
        // さいしょはクラウドの写真をそのまま使う（ほかの端末で消した写真が、もどってこないように）
        gotPics = true;
        const all = {};
        qs.forEach(d => { const { word, data } = d.data(); if (word && data) all[word] = data; });
        s.current.cloudPics = { ...all };
        setPics(all);
        setPicsReady(true);
        return;
      }
      const add = {}, del = [];
      qs.docChanges().forEach(ch => {
        const { word, data } = ch.doc.data();
        if (!word) return;
        if (ch.type === "removed") { delete s.current.cloudPics[word]; del.push(word); return; }
        if (ch.doc.metadata.hasPendingWrites) return;
        s.current.cloudPics[word] = data;
        if (latest.current.pics[word] !== data) add[word] = data;
      });
      if (Object.keys(add).length || del.length) {
        setPics(p => { const n = { ...p, ...add }; del.forEach(w => delete n[w]); return n; });
      }
      setPicsReady(true);
    }, fail));
  };

  const startSync = (u) => {
    stopSync();
    setStatus("connecting"); setError("");
    const families = firebase.firestore().collection("hatsuonFamilies");
    const email = (u.email || "").toLowerCase();
    const stored = lsGet(FAMILY_KEY);
    const linked = stored
      ? Promise.resolve(families.doc(stored))
      : families.where("allowedEmails", "array-contains", email).limit(1).get().then(async (qs) => {
          if (!qs.empty) {
            const ref = qs.docs[0].ref;
            await mergeCloudIntoLocal(ref);
            await uploadFavs(ref, false);
            await uploadAllPics(ref);
            return ref;
          }
          const created = families.doc();
          await uploadFavs(created, true, email, u.uid);
          await uploadAllPics(created);
          return created;
        });
    linked.then((ref) => {
      if (firebase.auth().currentUser !== u) return; // そのあいだにログアウトした
      lsSet(FAMILY_KEY, ref.id);
      s.current.famRef = ref;
      subscribe(ref);
    }).catch(fail);
  };

  useEffect(() => {
    if (!CLOUD_AVAILABLE) return;
    firebase.auth().getRedirectResult().catch(e => setError(`ログイン できませんでした（${e.message}）`));
    return firebase.auth().onAuthStateChanged((u) => {
      setAuthKnown(true);
      setUser(u);
      if (u) startSync(u);
      else { stopSync(); setStatus("off"); }
    });
  }, []);

  // 変わったところだけクラウドに書く
  useEffect(() => {
    const st = s.current, fam = st.famRef;
    if (!fam || !ready || draggingRef.current) return;
    const j = JSON.stringify(favs);
    if (j !== st.lastFavs) {
      st.lastFavs = j;
      fam.update({ favs, updatedAt: Date.now() }).catch(fail);
    }
  }, [favs, ready, dragId]);

  useEffect(() => {
    const st = s.current, fam = st.famRef;
    if (!fam || !picsReady) return;
    Object.entries(pics).forEach(([word, data]) => {
      if (st.cloudPics[word] === data || st.uploading[word]) return;
      if (data.length > MAX_PIC_CHARS) { // むかし登録した大きい写真は、小さくしてから送る
        st.uploading[word] = true;
        shrinkForCloud(data).then(small => {
          delete st.uploading[word];
          setPics(p => p[word] === data ? { ...p, [word]: small } : p);
        });
        return;
      }
      st.uploading[word] = true;
      fam.collection("pics").doc(picDocId(word)).set({ word, data, updatedAt: Date.now() })
        .then(() => { st.cloudPics[word] = data; })
        .catch(fail)
        .then(() => { delete st.uploading[word]; });
    });
    // この端末で消した写真だけ、クラウドからも消す
    Object.keys(st.lastPics).forEach(word => {
      if (!(word in pics)) fam.collection("pics").doc(picDocId(word)).delete().catch(() => {});
    });
    st.lastPics = Object.fromEntries(Object.keys(pics).map(w => [w, true]));
  }, [pics, picsReady]);

  const signIn = () => {
    setError("");
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt:"select_account" });
    firebase.auth().signInWithPopup(provider).catch(e => {
      if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
      // ホーム画面に追加したアプリなどではポップアップが使えないので、画面ごと移動してログインする
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
        return firebase.auth().signInWithRedirect(provider);
      }
      throw e;
    }).catch(e => setError(`ログイン できませんでした（${e.message}）`));
  };
  const signOut = () => { lsSet(FAMILY_KEY, null); stopSync(); firebase.auth().signOut(); };
  const addMember = (raw) => {
    const email = (raw || "").trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return "メールアドレスを たしかめてね";
    if (emails.includes(email)) return "もう はいっています";
    if (!s.current.famRef) return "まだ つながっていません";
    s.current.famRef.update({ allowedEmails: firebase.firestore.FieldValue.arrayUnion(email) }).catch(fail);
    return "";
  };
  const removeMember = (email) => {
    const me = (user && user.email || "").toLowerCase();
    if (emails.length <= 1 || email === me || !s.current.famRef) return;
    s.current.famRef.update({ allowedEmails: firebase.firestore.FieldValue.arrayRemove(email) }).catch(fail);
  };

  return { available: CLOUD_AVAILABLE, authKnown, user, status, error, emails, signIn, signOut, addMember, removeMember };
}

function App() {
  const [slots, setSlots]     = useState([]);
  const [favs, setFavs]       = useState(() => { try { return JSON.parse(localStorage.getItem("fav3")||"[]");  } catch { return []; } });
  const [pics, setPics]       = useState(() => { try { return JSON.parse(localStorage.getItem("pics1")||"{}"); } catch { return {}; } });
  const [newWord, setNewWord] = useState("");
  const [picMsg, setPicMsg]   = useState("");
  const [tab, setTab]         = useState("kana");
  const [openRow, setOpenRow] = useState(null);
  const [flash, setFlash]     = useState(null);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed]     = useState(0.7);
  const [favOpen, setFavOpen] = useState(true);
  const [favFilter, setFavFilter] = useState("すべて"); // フィルター（行）
  const [favCharFilter, setFavCharFilter] = useState("すべて"); // フィルター（行の中の1文字、例：あ行→い）
  const [favView, setFavView]     = useState("all"); // "all" | "pinned"（★ピン留めだけ表示）
  const [sortMode, setSortMode]   = useState(() => { try { return localStorage.getItem("favSortMode1") || "auto"; } catch { return "auto"; } }); // "auto"（あいうえお順）| "manual"（スワイプ手動）
  const [dragId, setDragId]       = useState(null);
  const dragState = useRef({ id:null, startY:0, startIndex:0, appliedDiff:0, itemHeight:0 });
  const itemRefs  = useRef({});
  const draggingRef = useRef(false); // ドラッグ中は保存を止めて、指を離した時に1回だけ保存する（連続書き込みによる引っかかり防止）
  const dragOffsetRef = useRef(0); // ドラッグ中の見た目のズレ（再描画のたびに参照するが、この値自体の変化では再描画を起こさない）
  const favsRef = useRef(favs);
  const filteredFavsRef = useRef([]);
  const [shareOpen, setShareOpen] = useState(false);
  const cloud = useCloudSync({ favs, setFavs, pics, setPics, draggingRef, dragId });

  useEffect(() => { window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); window.speechSynthesis.getVoices(); }, []);
  useEffect(() => { if (draggingRef.current) return; try { localStorage.setItem("fav3",  JSON.stringify(favs)); } catch {} }, [favs]);
  useEffect(() => { try { localStorage.setItem("pics1", JSON.stringify(pics)); } catch {} }, [pics]);
  useEffect(() => { try { localStorage.setItem("favSortMode1", sortMode); } catch {} }, [sortMode]);

  const handlePicUpload = (e) => {
    const file = e.target.files[0], word = newWord.trim();
    if (!file || !word) { setPicMsg("ことばと写真の両方を選んでね"); return; }
    if (file.size > 20*1024*1024) { setPicMsg("写真が大きすぎます（20MB以下にしてね）"); return; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const small = await compressImage(ev.target.result); // きょうゆうできるよう小さくする
      setPics(p => ({ ...p, [word]: small }));
      setNewWord(""); setPicMsg(`「${word}」を登録しました！`);
      e.target.value = ""; setTimeout(() => setPicMsg(""), 2500);
    };
    reader.readAsDataURL(file);
  };
  const removePic = (word) => setPics(p => { const n={...p}; delete n[word]; return n; });

  const pressKana = (c) => {
    speak(c, speed); setFlash(c); setTimeout(() => setFlash(null), 300);
    if (slots.length < 12) setSlots(p => [...p, c]);
  };
  const removeSlot = (i) => setSlots(p => p.filter((_,j) => j!==i));
  const speakWord = () => {
    if (!slots.length) return;
    setPlaying(true); speak(slots.join(""), speed);
    setTimeout(() => setPlaying(false), slots.length*700+600);
  };
  const addFav = () => {
    const w = slots.join(""); if (!w || favs.find(f=>f.word===w)) return;
    setFavs(p => [...p, { word:w, chars:[...slots], id:Date.now(), pinned:false }]);
  };
  const togglePin = (id) => setFavs(p => p.map(f => f.id===id ? { ...f, pinned: !f.pinned } : f));

  // スワイプでの手動並び替え
  // 指の動きは window 全体で追跡する（小さい⠿アイコンの上だけで拾おうとすると、
  // 並び替え中の再描画のタイミング次第でイベントを取りこぼし、途中で反応が止まることがあったため）
  const startDrag = (e, id) => {
    const el = itemRefs.current[id];
    if (!el) return;
    const rect = el.getBoundingClientRect();
    draggingRef.current = true;
    dragState.current = {
      id, startY: e.clientY, startIndex: filteredFavsRef.current.findIndex(f => f.id === id),
      appliedDiff: 0, itemHeight: rect.height + 9, // 9 = リストのgap
    };
    dragOffsetRef.current = 0;
    setDragId(id);
    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
  };
  const onDragMove = (e) => {
    const st = dragState.current;
    if (st.id == null) return;
    const rawOffset = e.clientY - st.startY;
    dragOffsetRef.current = rawOffset;
    // 1px動くたびに画面全体を再描画しないよう、移動中の見た目はReactの状態を介さず要素に直接反映する
    const el = itemRefs.current[st.id];
    if (el) el.style.transform = `translateY(${rawOffset}px) scale(1.02)`;
    const diff = Math.round(rawOffset / st.itemHeight);
    if (diff !== st.appliedDiff) {
      const list = filteredFavsRef.current;
      const curIndex = list.findIndex(f => f.id === st.id);
      const newIndex = Math.max(0, Math.min(list.length - 1, st.startIndex + diff));
      if (newIndex !== curIndex && curIndex !== -1) {
        // フィルター表示中の並び替え：フィルターに該当する項目だけを並べ替え、対象外の項目は元の位置のまま保つ
        const visible = [...list];
        const [moved] = visible.splice(curIndex, 1);
        visible.splice(newIndex, 0, moved);
        const visibleIds = new Set(visible.map(f => f.id));
        let vi = 0;
        const merged = favsRef.current.map(f => visibleIds.has(f.id) ? visible[vi++] : f);
        setFavs(merged);
      }
      st.appliedDiff = diff;
    }
  };
  const endDrag = () => {
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", endDrag);
    window.removeEventListener("pointercancel", endDrag);
    dragState.current = { id:null, startY:0, startIndex:0, appliedDiff:0, itemHeight:0 };
    setDragId(null);
    dragOffsetRef.current = 0;
    draggingRef.current = false;
    try { localStorage.setItem("fav3", JSON.stringify(favsRef.current)); } catch {}
  };

  // ソート＆フィルター適用（手動モード中も行フィルタは有効・並び順のベースは favs のまま）
  // ピン留め（★）したお気に入りを最優先で先頭に、その中はあいうえお順
  const sortedFavs = [...favs].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0) || compareKana(a.word, b.word));
  const baseFavs = sortMode === "manual" ? favs : sortedFavs;
  const rowFiltered = favFilter === "すべて" ? baseFavs : baseFavs.filter(f => getRowLabel(f.word) === favFilter);
  const charFiltered = favCharFilter === "すべて" ? rowFiltered : rowFiltered.filter(f => f.word[0] === favCharFilter);
  const filteredFavs = favView === "pinned" ? charFiltered.filter(f => f.pinned) : charFiltered;
  const pinnedCount = favs.filter(f => f.pinned).length;
  favsRef.current = favs;
  filteredFavsRef.current = filteredFavs;

  // フィルターに実際に該当する行ラベルだけ表示（ピン留めタブでは、ピン留めした単語の中だけで判定）
  const favPoolForLabels = favView === "pinned" ? favs.filter(f => f.pinned) : favs;
  const usedLabels = ["すべて", ...FILTER_LABELS.slice(1).filter(l => favPoolForLabels.some(f => getRowLabel(f.word) === l))];
  // 行を選んだ時だけ、その行の中で実際に使われている文字（例：あ行→い・う）を細かい絞り込みとして表示
  const favPoolForChars = favFilter === "すべて" ? [] : favPoolForLabels.filter(f => getRowLabel(f.word) === favFilter);
  const usedChars = Array.from(new Set(favPoolForChars.map(f => f.word[0]))).sort((a,b) => (KANA_INDEX[a] ?? 999) - (KANA_INDEX[b] ?? 999));

  // ログインするまでは使えない（PCのファイルを直接開いたとき・Firebaseが読みこめないときは、この端末だけで使える）
  if (cloud.available && !cloud.user) return <LoginGate cloud={cloud} />;

  return (
    <div style={{ minHeight:"100vh", background:"#f5f0ff", paddingBottom:48 }}>
      {shareOpen && <ShareSheet cloud={cloud} onClose={() => setShareOpen(false)} />}

      {/* ヘッダー */}
      <div style={{ background:"linear-gradient(90deg,#ff7eb3,#ff9a3c)", padding:"14px 18px 12px", boxShadow:"0 4px 16px rgba(255,100,150,0.35)", display:"flex", alignItems:"center", gap:12 }}>
        <span style={{ fontSize:30 }}>🎤</span>
        <div>
          <div style={{ color:"#fff", fontSize:20, fontWeight:900, letterSpacing:2 }}>はっせいれんしゅう</div>
          <div style={{ color:"rgba(255,255,255,0.85)", fontSize:11 }}>ひらがなをおして ことばをつくろう！</div>
        </div>
        {cloud.available && (
          <button onClick={() => setShareOpen(true)} aria-label="きょうゆう" style={{
            marginLeft:"auto", position:"relative", width:42, height:42, borderRadius:"50%", border:"none",
            background:"rgba(255,255,255,0.3)", fontSize:22, cursor:"pointer", flexShrink:0,
          }}>☁️<span style={{ position:"absolute", right:3, bottom:3, width:11, height:11, borderRadius:"50%", background:STATUS_DOT[cloud.status], border:"2px solid #fff" }} /></button>
        )}
      </div>

      {/* 速度調整（お気に入りの上） */}
      <SpeedBar speed={speed} setSpeed={setSpeed} />

      {/* ⭐ お気に入りセクション */}
      <div style={{ margin:"0 12px 0", background:"linear-gradient(135deg,#fff0f6,#fff)", borderRadius:22, boxShadow:"0 4px 20px rgba(233,30,99,0.15)", border:"3px solid #f48fb1", overflow:"hidden" }}>

        {/* ヘッダー行 */}
        <div style={{ display:"flex", flexDirection:"column", gap:8, padding:"12px 16px 10px" }}>
          <button onClick={() => setFavOpen(o=>!o)} style={{ width:"100%", background:"none", border:"none", cursor:"pointer", display:"flex", alignItems:"center", gap:10, padding:0 }}>
            <span style={{ fontSize:26 }}>⭐</span>
            <div style={{ textAlign:"left", flex:1 }}>
              <div style={{ fontSize:18, fontWeight:900, color:"#e91e63" }}>お気に入り</div>
              <div style={{ fontSize:11, color:"#f48fb1" }}>{favs.length > 0 ? `${favs.length}こ登録中` : "まだ登録がありません"}</div>
            </div>
            <span style={{ fontSize:16, color:"#f48fb1", fontWeight:700, marginLeft:4 }}>{favOpen ? "▲":"▼"}</span>
          </button>
          {/* 並び替えモード切り替え・全解除（2行目） */}
          {favOpen && (favs.length > 1 || favs.length > 0) && (
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {favs.length > 1 && (
                <div style={{ display:"flex", borderRadius:16, border:"2px solid #ff9a3c", overflow:"hidden" }}>
                  <button onClick={() => setSortMode("auto")} style={{
                    padding:"5px 8px", border:"none", cursor:"pointer",
                    background: sortMode==="auto" ? "linear-gradient(135deg,#ff9a3c,#ff7043)":"#fff0e0",
                    color: sortMode==="auto" ? "#fff":"#ff9a3c",
                    fontSize:10, fontWeight:800, whiteSpace:"nowrap",
                  }}>🔤 あいうえお順</button>
                  <button onClick={() => setSortMode("manual")} style={{
                    padding:"5px 8px", border:"none", cursor:"pointer",
                    background: sortMode==="manual" ? "linear-gradient(135deg,#ff9a3c,#ff7043)":"#fff0e0",
                    color: sortMode==="manual" ? "#fff":"#ff9a3c",
                    fontSize:10, fontWeight:800, whiteSpace:"nowrap",
                  }}>✋ 手動</button>
                </div>
              )}
              {/* お気に入り全解除 */}
              {favs.length > 0 && (
                <button onClick={() => { if (window.confirm(`お気に入りを${favs.length}こ、ぜんぶ消しますか？`)) setFavs([]); }} style={{
                  padding:"5px 8px", border:"2px solid #ff8a80", borderRadius:16, background:"#fff",
                  color:"#e53935", fontSize:10, fontWeight:800, cursor:"pointer", whiteSpace:"nowrap",
                }}>🗑️ 全解除</button>
              )}
            </div>
          )}
        </div>

        {favOpen && (
          <div style={{ padding:"0 12px 14px" }}>

            {/* すべて / ★ピン留め タブ */}
            {pinnedCount > 0 && (
              <div style={{ display:"flex", borderRadius:20, border:"2px solid #f48fb1", overflow:"hidden", marginBottom:10 }}>
                <button onClick={() => { setFavView("all"); setFavCharFilter("すべて"); }} style={{
                  flex:1, padding:"7px 10px", border:"none", cursor:"pointer",
                  background: favView==="all" ? "linear-gradient(135deg,#f48fb1,#e91e63)":"#fff",
                  color: favView==="all" ? "#fff":"#e91e63",
                  fontSize:12, fontWeight:800,
                }}>すべて（{favs.length}）</button>
                <button onClick={() => { setFavView("pinned"); setFavCharFilter("すべて"); }} style={{
                  flex:1, padding:"7px 10px", border:"none", cursor:"pointer",
                  background: favView==="pinned" ? "linear-gradient(135deg,#ffca28,#f9a825)":"#fff",
                  color: favView==="pinned" ? "#fff":"#f9a825",
                  fontSize:12, fontWeight:800,
                }}>⭐ ピン留め（{pinnedCount}）</button>
              </div>
            )}

            {/* フィルターバー（すべて・ピン留めどちらのタブでも表示） */}
            {favs.length > 0 && usedLabels.length > 2 && (
              <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:10, marginBottom:4 }}>
                {usedLabels.map(label => (
                  <button key={label} onClick={() => { setFavFilter(label); setFavCharFilter("すべて"); }} style={{
                    padding:"5px 12px", borderRadius:20, whiteSpace:"nowrap",
                    background: favFilter===label ? "linear-gradient(135deg,#f48fb1,#e91e63)":"#fff",
                    color: favFilter===label ? "#fff":"#e91e63",
                    border:`2px solid ${favFilter===label ? "#e91e63":"#f8bbd0"}`,
                    fontSize:12, fontWeight:800, cursor:"pointer",
                    boxShadow: favFilter===label ? "0 2px 8px rgba(233,30,99,0.3)":"none",
                  }}>{label}</button>
                ))}
              </div>
            )}

            {/* 文字での細かい絞り込み（例：あ行を選んだあと、い・う・え・お だけに絞る） */}
            {favFilter !== "すべて" && usedChars.length > 1 && (
              <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:10, marginBottom:4 }}>
                {["すべて", ...usedChars].map(ch => (
                  <button key={ch} onClick={() => setFavCharFilter(ch)} style={{
                    padding:"4px 12px", borderRadius:16, whiteSpace:"nowrap",
                    background: favCharFilter===ch ? "linear-gradient(135deg,#ffb74d,#ff9a3c)":"#fff",
                    color: favCharFilter===ch ? "#fff":"#ff9a3c",
                    border:`2px solid ${favCharFilter===ch ? "#ff9a3c":"#ffe0b2"}`,
                    fontSize:11, fontWeight:800, cursor:"pointer",
                  }}>{ch}</button>
                ))}
              </div>
            )}

            {/* リスト */}
            {!favs.length ? (
              <div style={{ textAlign:"center", padding:"16px 0", color:"#f8bbd0", fontSize:13 }}>
                ことばをつくって「⭐ お気に入り」をおしてね！
              </div>
            ) : filteredFavs.length === 0 ? (
              <div style={{ textAlign:"center", padding:"16px 0", color:"#f8bbd0", fontSize:13 }}>
                {favView === "pinned" ? "★をつけたお気に入りはまだありません" : "この行の登録はありません"}
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
                {sortMode === "manual" && (
                  <div style={{ textAlign:"center", fontSize:11, color:"#ff9a3c", fontWeight:700, marginBottom:2 }}>
                    ⠿ を指でスワイプして並び替えできます
                  </div>
                )}
                {filteredFavs.map((fav) => {
                  const dragging = dragId === fav.id;
                  return (
                    <div key={fav.id}
                      ref={el => { itemRefs.current[fav.id] = el; }}
                      style={{
                        background:"#fff", borderRadius:18, padding:"12px 14px",
                        display:"flex", alignItems:"center", gap:8,
                        boxShadow: dragging ? "0 8px 20px rgba(233,30,99,0.35)" : "0 3px 12px rgba(233,30,99,0.1)",
                        border: fav.pinned ? "2px solid #ffca28" : "2px solid #fce4ec",
                        position:"relative",
                        transform: dragging ? `translateY(${dragOffsetRef.current}px) scale(1.02)` : "none",
                        zIndex: dragging ? 10 : 1,
                        transition: dragging ? "none" : "transform 0.18s, box-shadow 0.18s",
                      }}>
                      {/* ピン留め★（あいうえお順モードのみ・上に来るお気に入り） */}
                      {sortMode === "auto" && (
                        <button onClick={() => togglePin(fav.id)} style={{
                          position:"absolute", top:7, left:9, width:24, height:24,
                          background: fav.pinned ? "#ffe082":"#f5f5f5", border:"none", borderRadius:"50%",
                          color: fav.pinned ? "#f9a825":"#bbb", fontSize:14, cursor:"pointer",
                          display:"flex", alignItems:"center", justifyContent:"center",
                        }}>{fav.pinned ? "⭐":"☆"}</button>
                      )}

                      {/* 削除ボタン（あいうえお順モードのみ） */}
                      {sortMode === "auto" && (
                        <button onClick={() => setFavs(p => p.filter(f=>f.id!==fav.id))} style={{
                          position:"absolute", top:7, right:9, width:24, height:24,
                          background:"#ffcdd2", border:"none", borderRadius:"50%",
                          color:"#e53935", fontSize:13, fontWeight:900, cursor:"pointer",
                          display:"flex", alignItems:"center", justifyContent:"center",
                        }}>✕</button>
                      )}

                      {/* ドラッグハンドル（手動モードのみ・スワイプで並び替え） */}
                      {sortMode === "manual" && (
                        <div
                          onPointerDown={(e) => startDrag(e, fav.id)}
                          style={{
                            width:34, height:52, display:"flex", alignItems:"center", justifyContent:"center",
                            fontSize:24, color:"#90a4ae", cursor:"grab", touchAction:"none", userSelect:"none",
                          }}
                        >⠿</div>
                      )}

                      {/* 単語 */}
                      <div style={{ flex:1, fontSize:26, fontWeight:900, color:"#e91e63", letterSpacing:3, paddingLeft: sortMode==="auto" ? 20:0, paddingRight: sortMode==="manual" ? 0:20 }}>{fav.word}</div>

                      {/* 読む */}
                      <button onClick={() => speak(fav.word, speed)} style={{
                        width:48, height:48, background:"linear-gradient(135deg,#42a5f5,#1565c0)",
                        border:"none", borderRadius:13, color:"#fff", fontSize:21, cursor:"pointer",
                        boxShadow:"0 3px 10px rgba(66,165,245,0.4)", display:"flex", alignItems:"center", justifyContent:"center",
                      }}>🔊</button>

                      {/* 編集（あいうえお順モードのみ） */}
                      {sortMode === "auto" && (
                        <button onClick={() => setSlots([...fav.chars])} style={{
                          width:48, height:48, background:"linear-gradient(135deg,#66bb6a,#2e7d32)",
                          border:"none", borderRadius:13, color:"#fff", fontSize:19, cursor:"pointer",
                          boxShadow:"0 3px 10px rgba(102,187,106,0.4)", display:"flex", alignItems:"center", justifyContent:"center",
                        }}>✏️</button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {/* 速度調整（入力スペースの上） */}
      <SpeedBar speed={speed} setSpeed={setSpeed} />

      {/* ことばエリア */}
      <div style={{ margin:"0 12px 10px", background:"#fff", borderRadius:22, padding:"14px 16px", boxShadow:"0 4px 20px rgba(0,0,0,0.08)", border:"3px solid #ffe0b2" }}>
        <div style={{ fontSize:12, color:"#ff9a3c", fontWeight:700, marginBottom:8 }}>🌟 つくったことば</div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:7, minHeight:52, alignItems:"center" }}>
          {!slots.length
            ? <span style={{ color:"#ddd", fontSize:15 }}>ひらがなをえらんでね 👇</span>
            : slots.map((c,i) => (
              <button key={i} onClick={() => removeSlot(i)} style={{
                width:48, height:48, borderRadius:14,
                background:"linear-gradient(135deg,#ffe082,#ffb74d)",
                border:"none", fontSize:26, fontWeight:900, cursor:"pointer",
                boxShadow:"0 3px 8px rgba(255,150,0,0.4)", color:"#5d4037",
                display:"flex", alignItems:"center", justifyContent:"center",
              }}>{c}</button>
            ))}
        </div>
        <div style={{ display:"flex", gap:7, marginTop:12 }}>
          <button onClick={speakWord} disabled={!slots.length} style={{
            flex:1, padding:"12px 6px",
            background: slots.length ? "linear-gradient(135deg,#42a5f5,#1565c0)":"#e8e8e8",
            color:"#fff", border:"none", borderRadius:14, fontSize:15, fontWeight:900,
            cursor: slots.length ? "pointer":"default",
            boxShadow: slots.length ? "0 4px 14px rgba(66,165,245,0.45)":"none",
            transform: playing ? "scale(0.95)":"scale(1)", transition:"all 0.15s",
          }}>🔊 よむ</button>
          <button onClick={addFav} disabled={!slots.length} style={{
            flex:1, padding:"12px 6px",
            background: slots.length ? "linear-gradient(135deg,#f48fb1,#e91e63)":"#e8e8e8",
            color:"#fff", border:"none", borderRadius:14, fontSize:15, fontWeight:900,
            cursor: slots.length ? "pointer":"default",
            boxShadow: slots.length ? "0 4px 14px rgba(233,30,99,0.4)":"none",
          }}>⭐ お気に入り</button>
          <button onClick={() => setSlots([])} disabled={!slots.length} style={{
            padding:"12px 15px", background: slots.length ? "#ff7043":"#e8e8e8",
            color:"#fff", border:"none", borderRadius:14, fontSize:18,
            cursor: slots.length ? "pointer":"default",
            boxShadow: slots.length ? "0 4px 12px rgba(255,112,67,0.4)":"none",
          }}>🗑️</button>
        </div>
        {!!slots.length && <div style={{ fontSize:10, color:"#ccc", marginTop:6 }}>※ 文字をタップすると削除できます</div>}
      </div>

      {/* タブ */}
      <div style={{ display:"flex", margin:"0 12px 12px", gap:8 }}>
        {[
          { key:"kana", label:"🔤", sub:"ひらがな",   color:"#ff9a3c", bg:"linear-gradient(135deg,#ffcc80,#ff9a3c)" },
          { key:"pics", label:"📷", sub:"ことばと絵", color:"#26a69a", bg:"linear-gradient(135deg,#80cbc4,#26a69a)" },
        ].map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{
            flex:1, padding:"11px 6px",
            background: tab===t.key ? t.bg:"#fff",
            color: tab===t.key ? "#fff":"#aaa",
            border:`2.5px solid ${tab===t.key ? t.color:"#e8e8e8"}`,
            borderRadius:16, cursor:"pointer",
            boxShadow: tab===t.key ? `0 5px 16px ${t.color}55`:"0 2px 6px rgba(0,0,0,0.06)",
            transition:"all 0.18s",
            display:"flex", flexDirection:"column", alignItems:"center", gap:2,
          }}>
            <span style={{ fontSize:22 }}>{t.label}</span>
            <span style={{ fontSize:11, fontWeight:800 }}>{t.sub}</span>
          </button>
        ))}
      </div>

      {/* ひらがなタブ */}
      {tab === "kana" && (
        <div style={{ padding:"0 12px", display:"flex", flexDirection:"column", gap:8 }}>
          {KANA_ROWS.map((row, idx) => {
            const open = openRow === idx;
            return (
              <div key={row.row} style={{ background:"#fff", borderRadius:16, overflow:"hidden", boxShadow:`0 3px 10px ${row.color}28`, border:`2.5px solid ${open ? row.color:"#efefef"}`, transition:"border-color 0.2s" }}>
                <button onClick={() => setOpenRow(open ? null : idx)} style={{
                  width:"100%", padding:"12px 14px", background: open ? row.color:"#fff",
                  border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"space-between",
                }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:17, fontWeight:900, color: open ? "#fff":row.color }}>{row.row}</span>
                    {!open && <span style={{ fontSize:13, color:"#bbb", letterSpacing:2 }}>{row.kana.slice(0,5).map(k=>k.char).join("・")}</span>}
                  </div>
                  <span style={{ fontSize:16, color: open ? "#fff":"#ccc", fontWeight:700 }}>{open ? "▲":"▼"}</span>
                </button>
                {open && (
                  <div style={{ padding:"12px 12px 14px", display:"flex", flexDirection:"column", gap:12 }}>
                    <div><div style={{ fontSize:10, color:"#aaa", marginBottom:6, fontWeight:700 }}>せいおん</div><KanaGroup items={row.kana} color={row.color} flash={flash} onPress={pressKana} /></div>
                    {row.dakuten    && <div><div style={{ fontSize:10, color:"#aaa", marginBottom:6, fontWeight:700 }}>だくてん（゛）</div><KanaGroup items={row.dakuten}    color={row.color} flash={flash} onPress={pressKana} /></div>}
                    {row.handakuten && <div><div style={{ fontSize:10, color:"#aaa", marginBottom:6, fontWeight:700 }}>はんだくてん（゜）</div><KanaGroup items={row.handakuten} color={row.color} flash={flash} onPress={pressKana} /></div>}
                    {row.small      && <div><div style={{ fontSize:10, color:"#aaa", marginBottom:6, fontWeight:700 }}>こもじ</div><KanaGroup items={row.small}      color={row.color} flash={flash} onPress={pressKana} /></div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ことばと絵タブ */}
      {tab === "pics" && (
        <div style={{ padding:"0 12px" }}>
          <div style={{ background:"#fff", borderRadius:18, padding:"14px 16px", marginBottom:12, boxShadow:"0 3px 12px rgba(0,0,0,0.08)", border:"2px solid #e0f2f1" }}>
            <div style={{ fontSize:12, color:"#26a69a", fontWeight:700, marginBottom:10 }}>📷 ことばと絵をついかする</div>
            <input type="text" value={newWord} onChange={e => setNewWord(e.target.value)}
              placeholder="ことばを入力（例：パンダ）"
              style={{ width:"100%", padding:"10px 12px", fontSize:15, borderRadius:10, border:"2px solid #e0e0e0", marginBottom:10, outline:"none" }} />
            <label style={{
              display:"flex", alignItems:"center", justifyContent:"center", gap:8,
              width:"100%", padding:"12px 6px",
              background: newWord.trim() ? "linear-gradient(135deg,#26a69a,#00695c)":"#e0e0e0",
              color:"#fff", borderRadius:12, fontSize:14, fontWeight:800,
              cursor: newWord.trim() ? "pointer":"default",
            }}>
              📁 写真をえらぶ
              <input type="file" accept="image/*" onChange={handlePicUpload} disabled={!newWord.trim()} style={{ display:"none" }} />
            </label>
            {picMsg && <div style={{ fontSize:12, color:"#00897b", marginTop:8, fontWeight:700 }}>{picMsg}</div>}
          </div>
          {Object.keys(pics).length === 0 ? (
            <div style={{ background:"#fff", borderRadius:20, padding:32, textAlign:"center", color:"#ccc", boxShadow:"0 2px 10px rgba(0,0,0,0.06)" }}>
              <div style={{ fontSize:48, marginBottom:12 }}>📷</div>
              <div style={{ fontSize:15 }}>まだ絵が登録されていません</div>
              <div style={{ fontSize:12, marginTop:8 }}>上のフォームでことばと写真をついかしてね！</div>
            </div>
          ) : (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:10 }}>
              {Object.entries(pics).map(([word, src]) => (
                <div key={word} onClick={() => speak(word, speed)} style={{
                  background:"#fff", borderRadius:16, overflow:"hidden",
                  boxShadow:"0 3px 10px rgba(0,0,0,0.09)", border:"2px solid #e0f2f1",
                  cursor:"pointer", position:"relative",
                }}>
                  <button onClick={e => { e.stopPropagation(); removePic(word); }} style={{
                    position:"absolute", top:6, right:6, width:24, height:24, zIndex:2,
                    background:"rgba(255,255,255,0.9)", border:"none", borderRadius:"50%",
                    color:"#e53935", fontSize:13, fontWeight:900, cursor:"pointer",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    boxShadow:"0 2px 6px rgba(0,0,0,0.2)",
                  }}>✕</button>
                  <img src={src} alt={word} style={{ width:"100%", height:120, objectFit:"contain", display:"block", background:"#f9f9f9" }} />
                  <div style={{ padding:"8px 6px", textAlign:"center", fontSize:18, fontWeight:900, color:"#00897b", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                    🔊 {word}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
